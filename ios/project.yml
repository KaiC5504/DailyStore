name: DailyStore

options:
  bundleIdPrefix: com.kaichuan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# No `configFiles:` — a project-level xcconfig comes out of XcodeGen as a file reference
# with no parent group, and Codemagic's signing step dies reading it. The team is written
# in by `xcode-project use-profiles`; the build number comes from the command line.

settings:
  base:
    # Swift 5 language mode on purpose: strict concurrency turns first bring-up into a
    # wall of actor-isolation errors that cannot be iterated on without a Mac.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    # A default only. CI overrides this per build from the command line; App Store
    # Connect rejects a build number it has already seen.
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  ValorantCore:
    path: Packages/ValorantCore

targets:
  DailyStore:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - package: ValorantCore
      - target: DailyStoreWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichuan.dailystore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Keychain sharing needs no App ID capability: App Store profiles already allow TEAMID.*.
    # That is why the widget shares data through the keychain instead of an App Group.
    entitlements:
      path: Generated/DailyStore.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kaichuan.dailystore.shared
    info:
      path: Generated/DailyStore-Info.plist
      properties:
        CFBundleDisplayName: DailyStore
        # XcodeGen's defaults are the literals "1.0" and "1"; referencing the build
        # settings is what lets CI vary the build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # Only standard HTTPS; without this every upload sits in TestFlight as
        # "Missing Compliance".
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        KeychainAccessGroup: $(AppIdentifierPrefix)com.kaichuan.dailystore.shared
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.kaichuan.dailystore.refresh
        CFBundleURLTypes:
          - CFBundleURLName: com.kaichuan.dailystore
            CFBundleURLSchemes:
              - dailystore
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Upload validation demands all four for iPad regardless of device family.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  DailyStoreWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    dependencies:
      - package: ValorantCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichuan.dailystore.widget
    entitlements:
      path: Generated/DailyStoreWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kaichuan.dailystore.shared
    info:
      path: Generated/DailyStoreWidget-Info.plist
      properties:
        CFBundleDisplayName: DailyStore
        # Must match the app's or upload validation rejects the build.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.kaichuan.dailystore.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

# Declared so `xcodebuild -scheme DailyStore` works without Xcode ever having opened the
# project to autocreate one.
schemes:
  DailyStore:
    build:
      targets:
        DailyStore: all
        DailyStoreWidget: all
    run:
      config: Debug
    archive:
      config: Release
